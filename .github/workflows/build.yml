# AI-GENERATED (partial): Claude (Anthropic) added the pull_request trigger, the
# read-only permissions and the test job. SecretKey is a project built with
# AI-generated code; see README.md.
name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# The workflow only needs to read the code.
permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '10.0.x'

      - name: Test (password known-answer tests)
        run: dotnet test SecretKey.Core.Tests/SecretKey.Core.Tests.csproj --configuration Release

  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Publish (no MSIX, just EXE)
        run: dotnet publish SecretKeyUI/SecretKeyUI.csproj -c Release -r win-x64 --self-contained false -o publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SecretKey-build
          path: publish
